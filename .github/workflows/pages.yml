name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      # Sella sw.js con el commit: así el móvil detecta la versión nueva, borra la caché vieja y se recarga
      - name: Versión del service worker
        run: sed -i "/^const CACHE/s/__VERSION__/${GITHUB_SHA::12}/" sw.js && grep -n "const CACHE" sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
