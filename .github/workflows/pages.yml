name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cada paso solo con lo que necesita: las pruebas, solo leer; publicar, además, escribir en Pages
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # en cola: dos push seguidos no se pisan (fallaba el segundo)

jobs:
  # Tests primero: si alguno falla, no se publica (la versión rota no llega al móvil)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (node --test, sin dependencias)
        run: node --test tests/*.test.js
        env:
          TZ: Europe/Madrid

  deploy:
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      # Sella sw.js con el commit: así el móvil detecta la versión nueva, borra la caché vieja y se recarga
      - name: Versión del service worker
        run: sed -i "/^const CACHE/s/__VERSION__/${GITHUB_SHA::12}/" sw.js && grep -n "const CACHE" sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
